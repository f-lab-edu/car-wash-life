spring.application.name=car-wash-life
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car_wash_life}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

auth.jwt.secret=${JWT_SECRET:car-wash-life-local-secret-key-change-me}
